<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#EBE3D1">
  <title>{% if page.title %}{{ page.title | escape }} — {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/v61-fonts.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/v61-original.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/v61-site.css' | relative_url }}">
</head>
<body>
  {% include v61-svg.html %}
  <main class="shell">
    <nav class="sor-top-nav{% if page.compact_header %} sor-top-nav-interior{% endif %}" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/stories/' | relative_url }}">Stories</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      {% if page.compact_header %}
      <a class="sor-compact-brand" href="{{ '/' | relative_url }}"
         aria-label="Some Odd Road homepage">
        <span>Some</span>
        <span class="sor-compact-odd">
          <img src="{{ '/assets/branding/design_SOR_sharp_O.png' | relative_url }}"
               alt="">dd
        </span>
        <span>Road</span>
      </a>
      {% endif %}
    </nav>
    {% unless page.compact_header %}
      {% include v61-masthead.html %}
    {% endunless %}
    {{ content }}
  </main>
  {% include v61-subscribe.html %}
  <footer class="sor-footer" aria-label="Site navigation">
    <a href="{{ '/' | relative_url }}">Front page</a>
    <a href="{{ '/stories/' | relative_url }}">All stories</a>
    <a href="{{ '/about/' | relative_url }}">About</a>
  </footer>
  <script src="{{ '/assets/js/v61-site.js' | relative_url }}" defer></script>
</body>
</html>
