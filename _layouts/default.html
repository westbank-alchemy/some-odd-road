<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#EBE3D1">
  <title>{% if page.title %}{{ page.title | escape }} — {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/v61-fonts.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/v61-original.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/v61-site.css' | relative_url }}">
</head>
<body>
  {% include v61-svg.html %}
  <main class="shell">
    {% include v61-masthead.html %}
    {{ content }}
  </main>
  {% include v61-subscribe.html %}
  <footer class="sor-footer" aria-label="Site navigation">
    <a href="{{ '/' | relative_url }}">Front page</a>
    <a href="{{ '/stories/' | relative_url }}">All stories</a>
    <a href="{{ '/about/' | relative_url }}">About</a>
  </footer>
  <script src="{{ '/assets/js/v61-site.js' | relative_url }}" defer></script>
</body>
</html>
