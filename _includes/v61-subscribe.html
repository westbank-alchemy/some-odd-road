<!-- SUBSCRIBE -->
<section class="sub" id="subscribe">
    <div class="sub-inner">
        <div class="sub-eyebrow">The Standing Order</div>
        <h3>One sketch. Every other week.</h3>
        <form class="sub-form" onsubmit="event.preventDefault()">
            <input type="email" id="sub-email" placeholder="your@email.com" required="">
            <button type="submit" id="sub-btn">Subscribe</button>
        </form>
        <div id="sor-signup-message" class="sor-notice" aria-live="polite"></div>
        <div class="sub-fine">Unsubscribe at any dive bar with cell signal.</div>
    </div>
</section>
